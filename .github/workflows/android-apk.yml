name: Build AM BUILDSTUDIO Android APK
on:
  push:
    branches: [cloudflare-migration-prep]
  workflow_dispatch:
    inputs:
      project_name:
        description: "Name of the starter app or game"
        required: false
        default: "AM Buildstudio Starter"
        type: string
      project_kind:
        description: "Project type"
        required: false
        default: "App"
        type: choice
        options: [App, Game]
      project_description:
        description: "Short project description"
        required: false
        default: "Generated Android starter project"
        type: string
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Generate Android project
        env:
          PROJECT_NAME: ${{ inputs.project_name }}
          PROJECT_KIND: ${{ inputs.project_kind }}
          PROJECT_DESCRIPTION: ${{ inputs.project_description }}
        run: node scripts/create-android-template.js
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile debug APK
        working-directory: android-output
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK exists
        run: test -s android-output/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: am-buildstudio-generated-starter-debug-apk
          path: android-output/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
