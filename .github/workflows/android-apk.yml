name: Build AM BUILDSTUDIO Android APK
on:
  push:
    branches: [cloudflare-migration-prep]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Generate complete Android starter project
        run: node scripts/create-android-template.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile debug APK
        working-directory: android-output
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK exists
        run: test -s android-output/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: am-buildstudio-generated-starter-debug-apk
          path: android-output/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
