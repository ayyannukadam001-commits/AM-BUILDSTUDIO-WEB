name: Check AM BUILDSTUDIO Worker
on:
  push:
    branches: [cloudflare-migration-prep]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: node --check worker/src/index.js
      - run: node --check worker/src/android-generator.js
      - run: node --check scripts/create-android-template.js
      - run: node scripts/test-android-generator.js
