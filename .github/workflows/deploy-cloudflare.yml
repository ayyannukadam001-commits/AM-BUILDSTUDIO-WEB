name: Deploy AM BUILDSTUDIO to Cloudflare
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - name: Build Pages frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build
      - name: Deploy Pages frontend
        run: npx --yes wrangler@4 pages deploy dist --project-name am-buildstudio --branch main
      - name: Apply D1 schema
        working-directory: worker
        run: npx --yes wrangler@4 d1 execute am-buildstudio --remote --file=schema.sql --config wrangler.toml
      - name: Deploy API Worker
        working-directory: worker
        run: npx --yes wrangler@4 deploy --config wrangler.toml
