name: Deploy AM BUILDSTUDIO to Cloudflare
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      GITHUB_BUILD_TOKEN: ${{ secrets.GITHUB_BUILD_TOKEN }}
      BUILD_CALLBACK_SECRET: ${{ secrets.BUILD_CALLBACK_SECRET }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate deployment configuration
        run: |
          set -eu
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SESSION_SECRET RESEND_API_KEY EMAIL_FROM GOOGLE_CLIENT_ID GITHUB_BUILD_TOKEN BUILD_CALLBACK_SECRET; do
            eval "value=\$$key"
            if [ -z "$value" ]; then echo "::error::$key is missing in GitHub Actions secrets/variables."; exit 1; fi
          done
          if grep -q 'REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID\|REPLACE_WITH_PAGES_DOMAIN\|REPLACE_WITH_GOOGLE_OAUTH_CLIENT_ID' worker/wrangler.toml; then
            echo "::error::Replace D1 database ID, Pages origin and Google client ID in worker/wrangler.toml first."
            exit 1
          fi
      - run: npm install
      - name: Build Pages frontend
        run: npm run build
      - name: Deploy Pages preview
        run: npx --yes wrangler@4 pages deploy dist --project-name am-buildstudio --branch cloudflare-migration-prep
      - name: Apply D1 schema
        working-directory: worker
        run: npx --yes wrangler@4 d1 execute am-buildstudio --remote --file=schema.sql --config wrangler.toml
      - name: Configure Worker secrets
        working-directory: worker
        run: |
          printf %s "$SESSION_SECRET" | npx --yes wrangler@4 secret put SESSION_SECRET --config wrangler.toml
          printf %s "$RESEND_API_KEY" | npx --yes wrangler@4 secret put RESEND_API_KEY --config wrangler.toml
          printf %s "$EMAIL_FROM" | npx --yes wrangler@4 secret put EMAIL_FROM --config wrangler.toml
          printf %s "$GITHUB_BUILD_TOKEN" | npx --yes wrangler@4 secret put GITHUB_TOKEN --config wrangler.toml
          printf %s "$BUILD_CALLBACK_SECRET" | npx --yes wrangler@4 secret put BUILD_CALLBACK_SECRET --config wrangler.toml
      - name: Deploy API Worker
        working-directory: worker
        run: npx --yes wrangler@4 deploy --config wrangler.toml
